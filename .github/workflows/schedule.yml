# Weekly PubMed ingestion into Solr. Runs on the Mac mini's second self-hosted runner (label
# progressx-etl), so a multi-hour run never holds up pull request checks or deploys on the CI runner,
# and so it can read the Solr ingest URL from Vault (it isn't kept as a GitHub secret).
name: SOLR ETL Pipelines

on:
  schedule:
    - cron: "30 9 * * 5" # Fridays at 09:30 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: solr-etl
  cancel-in-progress: false

env:
  python_backend_env: prod

jobs:
  solr-etl:
    runs-on: [self-hosted, macOS, progressx-etl]
    timeout-minutes: 360
    defaults:
      run:
        working-directory: data/DAGs/
    steps:
      - name: "Checkout Code Directory"
        uses: actions/checkout@v4

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.6"
          cache: "pip" # Caches dependencies for faster runs

      - name: "Install dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r ./requirements.txt

      # https://github-actions:<password>@progressx.ca/solr-ingest/ from Vault (secret/progressx/NginxFileConfig),
      # masked in the logs and passed to the ingestion steps as solr_prod_url
      - name: "Read the Solr ingest URL from Vault"
        run: |
          python3 ../../ci/vault-fetch.py value progressx/NginxFileConfig solr-ingest-url.txt "$RUNNER_TEMP/solr-url"
          url="$(cat "$RUNNER_TEMP/solr-url")"; rm -f "$RUNNER_TEMP/solr-url"
          echo "::add-mask::$url"
          echo "solr_prod_url=$url" >> "$GITHUB_ENV"

      - name: "Run Raw Ingestion Task"
        continue-on-error: true
        run: python ./DAG_raw_pubMed.py

      - name: "Run Clean Ingestion Task"
        continue-on-error: true
        run: python DAG_clean_migration.py
