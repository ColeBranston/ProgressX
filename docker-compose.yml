# Container logs (which include IP addresses and request paths) are rotated so they aren't kept
# indefinitely: at most 5 files of 10 MB per service (see docs/privacy/README.md)
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  nginx:
    image: nginx:latest
    container_name: progressx-nginx
    logging: *logging
    ports:
      - "${NGINX_PORT}:80"
    environment:
      FRONTEND_URL: ${FRONTEND_URL}
      SOLR_ORIGIN: ${SOLR_ORIGIN}
    volumes:
      # nginx fills ${FRONTEND_URL} / ${SOLR_ORIGIN} into this template on startup
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      # Basic-auth user for the /solr-ingest/ route (gitignored)
      - ./nginx/solr-ingest.htpasswd:/etc/nginx/solr-ingest.htpasswd:ro
    depends_on:
      - progressx
      - solr
    restart: unless-stopped

  progressx:
    build: ./progressx
    container_name: progressx-app
    logging: *logging
    env_file: ./progressx/.env.local
    environment:
      NODE_ENV: production
      PORT: ${FRONTEND_PORT}
      SEARCH_BACKEND_URL: ${SEARCH_BACKEND_URL}
      APP_URL: ${APP_URL}
    ports:
      - "127.0.0.1:${FRONTEND_PORT}:${FRONTEND_PORT}"
    depends_on:
      - search_backend
    restart: unless-stopped

  search_backend:
    build: ./data/search_backend
    container_name: progressx-search-backend
    logging: *logging
    environment:
      PORT: ${SEARCH_BACKEND_PORT}
      python_backend_env: local
      solr_local_url: ${SOLR_URL}
      REDIS_URL: ${REDIS_URL}
      SEARCH_CACHE_TTL_SECONDS: ${SEARCH_CACHE_TTL_SECONDS}
      DOC_CACHE_TTL_SECONDS: ${DOC_CACHE_TTL_SECONDS}
    ports:
      - "127.0.0.1:${SEARCH_BACKEND_PORT}:${SEARCH_BACKEND_PORT}"
    depends_on:
      - solr
      - redis
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    container_name: progressx-redis
    logging: *logging
    # pure cache: capped at 256 MB, evicts least-recently-used entries, nothing written to disk
    command: ["redis-server", "--port", "${REDIS_PORT}", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${REDIS_PORT}:${REDIS_PORT}"
    restart: unless-stopped

  solr:
    build: ./data/db
    container_name: progressx-solr
    logging: *logging
    command: ["-f", "--user-managed"]
    environment:
      SOLR_PORT: ${SOLR_PORT}
    volumes:
      - ./data/db/var/solr:/var/solr
    ports:
      - "127.0.0.1:${SOLR_PORT}:${SOLR_PORT}"
    restart: unless-stopped
