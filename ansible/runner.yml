# Installs a GitHub Actions self-hosted runner on this Mac as a launchd service, registered to
# ColeBranston/ProgressX. Two run here, each with its own label so one never waits on the other:
#   progressx      (default) CI: builds, tests, SonarQube, publishing and deploys (.github/workflows/ci.yml)
#   progressx-etl  the weekly Solr ingestion, which can run for hours (.github/workflows/schedule.yml)
# Add -e runner_label=progressx-etl for the second one.
# The registration token is short-lived; it is read from the environment, never the command line:
#   RUNNER_TOKEN=$(gh api -X POST repos/ColeBranston/ProgressX/actions/runners/registration-token --jq .token) \
#     ansible-playbook -i ansible/inventory.yml ansible/runner.yml
- name: GitHub Actions runner
  hosts: all
  gather_facts: true
  vars:
    runner_version: "2.338.0"
    runner_label: progressx
    runner_dir: "{{ lookup('env', 'HOME') }}/actions-runner/{{ runner_label }}"
    runner_name: "{{ ansible_hostname }}-{{ runner_label }}"
    repo: ColeBranston/ProgressX
    arch: "{{ 'arm64' if ansible_architecture in ['arm64', 'aarch64'] else 'x64' }}"
  tasks:
    - name: Create the runner folder
      ansible.builtin.file:
        path: "{{ runner_dir }}"
        state: directory
        mode: "0700"

    - name: Check whether it's installed
      ansible.builtin.stat:
        path: "{{ runner_dir }}/.runner"
      register: configured

    - name: Look up the release's published checksum
      when: not configured.stat.exists
      ansible.builtin.uri:
        url: "https://api.github.com/repos/actions/runner/releases/tags/v{{ runner_version }}"
        return_content: true
      register: release

    - name: Download the runner (checksum verified)
      when: not configured.stat.exists
      ansible.builtin.get_url:
        url: "https://github.com/actions/runner/releases/download/v{{ runner_version }}/{{ asset }}"
        dest: "{{ runner_dir }}/{{ asset }}"
        checksum: "{{ (release.json.assets | selectattr('name', 'equalto', asset) | first).digest }}"
        mode: "0600"
      vars:
        asset: "actions-runner-osx-{{ arch }}-{{ runner_version }}.tar.gz"

    - name: Unpack the runner
      when: not configured.stat.exists
      ansible.builtin.command:
        argv: [tar, -xzf, "actions-runner-osx-{{ arch }}-{{ runner_version }}.tar.gz"]
        chdir: "{{ runner_dir }}"
        creates: "{{ runner_dir }}/config.sh"

    - name: Register with GitHub
      when: not configured.stat.exists
      ansible.builtin.command:
        argv: [./config.sh, --unattended, --url, "https://github.com/{{ repo }}", --name, "{{ runner_name }}",
               --labels, "{{ runner_label }}", --work, _work, --replace, --token, "{{ lookup('env', 'RUNNER_TOKEN') }}"]
        chdir: "{{ runner_dir }}"
      no_log: true

    - name: Install the launchd service
      ansible.builtin.command: ./svc.sh install
      args:
        chdir: "{{ runner_dir }}"
        creates: "{{ lookup('env', 'HOME') }}/Library/LaunchAgents/actions.runner.{{ repo | replace('/', '-') }}.{{ runner_name }}.plist"

    # the service doesn't load a login shell, so give it the tools the workflow uses
    - name: Give the service a PATH with Docker, Node and Ansible
      ansible.builtin.copy:
        dest: "{{ runner_dir }}/.path"
        content: "/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:/Applications/Docker.app/Contents/Resources/bin\n"
        mode: "0644"

    - name: Start the service
      ansible.builtin.command: ./svc.sh start
      args:
        chdir: "{{ runner_dir }}"
      changed_when: true
