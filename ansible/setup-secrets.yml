# One-time: copies the deploy secrets from an existing checkout into ~/.progressx/app (mode 600), where
# the deploy playbook and CI read them. Existing files are left alone unless -e overwrite=true.
#   ansible-playbook -i ansible/inventory.yml ansible/setup-secrets.yml -e source_dir=/Users/colebranston/repos/ProgressX
- name: Collect the deploy secrets
  hosts: all
  gather_facts: false
  tasks:
    - name: Check the source folder
      ansible.builtin.assert:
        that: source_dir is defined
        fail_msg: "Pass -e source_dir=<the checkout that has .env, progressx/.env.local and nginx/solr-ingest.htpasswd>"
        quiet: true

    - name: Create the secrets folder
      ansible.builtin.file:
        path: "{{ secrets_dir }}"
        state: directory
        mode: "0700"

    - name: Copy the secret files
      ansible.builtin.copy:
        src: "{{ source_dir }}/{{ item.dest }}"
        dest: "{{ secrets_dir }}/{{ item.src }}"
        mode: "0600"
        force: "{{ overwrite | default(false) | bool }}"
      loop: "{{ secret_files }}"
      loop_control:
        label: "{{ item.dest }} -> {{ item.src }}"
      no_log: true
