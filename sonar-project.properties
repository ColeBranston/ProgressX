# SonarQube analysis of the whole repository: the Next.js app (frontend + its API routes), the Python
# search backend, the Solr ingestion DAGs and the food importer, plus the Dockerfiles and CI config.
# Run by .github/workflows/ci.yml after the tests (coverage reports must exist first). Locally:
#   cd progressx && npm run test:services && npm run test:coverage && cd ..
#   docker compose -f ci/test/docker-compose.yml run --rm python-tests
#   SONAR_TOKEN=... npx @sonar/scan   (or the sonar-scanner CLI)
sonar.projectKey=progressx
sonar.projectName=ProgressX
sonar.host.url=http://127.0.0.1:9000
sonar.sourceEncoding=UTF-8

sonar.sources=progressx/src,progressx/scripts,progressx/dockerfile,data/search_backend,data/DAGs,data/foods,docker-compose.yml,nginx,ci,ansible,.github
sonar.tests=progressx/tests,progressx/e2e,data/search_backend/tests,data/DAGs/tests,data/foods/tests,data/db/tests
sonar.exclusions=**/node_modules/**,**/__pycache__/**,**/tests/**,data/foods/raw/**,data/db/var/**,data/db/configsets/**,data/DAGs/test.py,data/DAGs/utils/reindex_clean.py,data/search_backend/test_encode_decode.py,progressx/src/app/data/**,**/*.htpasswd,nginx/solr-ingest-url.txt,ci/test/fixtures/**
# 3D rendering (three.js scenes) is checked by eye in the browser, not by unit tests
sonar.coverage.exclusions=progressx/src/app/internal_components/homepage/scene.ts,progressx/src/app/internal_components/mystats/exercise3dScene.ts,progressx/scripts/**,ci/**,ansible/**,.github/**,nginx/**,**/*.css,**/dockerfile,**/Dockerfile,docker-compose.yml
sonar.cpd.exclusions=progressx/src/app/internal_components/mystats/exercises.ts,progressx/src/app/internal_components/mystats/exerciseMotions.ts,progressx/src/app/internal_components/mystats/exercise3dScene.ts

sonar.javascript.lcov.reportPaths=progressx/coverage/lcov.info
sonar.python.version=3.12
sonar.python.coverage.reportPaths=data/coverage-python.xml

# fail the scan (and the CI job) when the quality gate fails
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=600
